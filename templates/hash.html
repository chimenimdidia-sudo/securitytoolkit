{% extends "base.html" %}

{% block title %}Hash Generator - Security Toolkit{% endblock %}

{% block content %}
<h1>Hash Generator</h1>

<div class="panel">
    <form method="POST">
        <label for="text">Text to hash</label>
        <input type="text" id="text" name="text" value="{{ text }}" placeholder="Type something">
        <p><button type="submit">Generate</button></p>
    </form>
</div>

{% if results %}
    <div class="panel">
        <h2>Results</h2>
        {% for name, value in results.items() %}
            <div class="hash-row">
                <div class="name">{{ name }}</div>
                <div class="value mono">{{ value }}</div>
            </div>
        {% endfor %}
    </div>
{% endif %}
{% endblock %}
