<!DOCTYPE html>
<html>
<head>
    <title>Hash Generator</title>
        <style>
        p { word-break: break-all; }
    </style>
</head>
<body>
    <h1>Hash Generator</h1>
    <form method="POST">
        <input type="text" name="text" value="{{ text }}" placeholder="Type something" size="40">
        <button type="submit">Generate</button>
    </form>

    {% if results %}
        <h2>Results</h2>
        {% for name, value in results.items() %}
            <p><strong>{{ name }}:</strong> {{ value }}</p>
        {% endfor %}
    {% endif %}
</body>
</html>
